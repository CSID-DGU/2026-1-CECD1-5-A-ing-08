spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: readb

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

server:
  port: ${PORT:8080}

cors:
  # 운영 환경에서는 반드시 실제 FE 도메인으로 교체할 것 (application-local.yml에서 오버라이드)
  allowed-origins: "http://localhost:3000,http://localhost:5173"

swagger:
  server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 3600000      # 1시간
  refresh-expiration-ms: 1209600000  # 14일

groq:
  api-key: ${GROQ_API_KEY:}   # Groq Whisper STT 전용 — 없으면 녹음 업로드만 실패
  whisper:
    url: https://api.groq.com/openai/v1/audio/transcriptions
    model: whisper-large-v3
    max-file-size-mb: 25
gemini:
  api-key: ${GEMINI_API_KEY}
  # OpenAI 호환 엔드포인트 — 응답 형식(choices[0].message.content)이 같아 GeminiAdapter가 그대로 파싱
  url: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
  model: gemini-3.8-flash

claude:
  api-key: ${CLAUDE_API_KEY:}   # ClaudeAdapter는 현재 호출처 없음
  url: https://api.anthropic.com/v1/messages
  model: claude-sonnet-4-5
  max-tokens: 4096

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}
  bucket: recordings

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
